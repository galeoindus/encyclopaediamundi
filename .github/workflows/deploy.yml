# Manual re-publish to Cloudflare Pages.
#
# Production is published by Cloudflare's Git integration on every push to
# main. This workflow is the escape hatch for re-publishing a commit by hand.
#
# It needs two repository secrets, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account id shown on the Workers & Pages page
# If they are absent the job skips instead of failing, so the repo stays green
# for anyone who has not set them up yet.

name: deploy

# Production is published by Cloudflare's own Git integration on every push to
# main. This job used to run on the same push and skip itself when the secrets
# were absent, so the Actions tab showed a green run that published nothing.
# It is now manual only: use it to re-publish a commit by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Do we have Cloudflare credentials?
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy automatically."
          fi

      - name: Stamp every page and asset URL for this build
        if: steps.check.outputs.ready == 'true'
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run stamp:build

      # A Pages project has to exist before anything can be published to it. On
      # a fresh Cloudflare account there is none, and `pages deploy` answers
      # "Project not found" — which is what a move to a new account looks like
      # from the outside. Creating it here makes the workflow the only step.
      - name: Make sure the Pages project exists
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages project create veridell --production-branch=main || true

      - name: Publish to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=veridell --branch=main --commit-dirty=true

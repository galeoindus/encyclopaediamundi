# Checks on every push and pull request: the modules parse, the pages build,
# the tests pass.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      # The tests boot the real modules in a DOM, and that needs jsdom. Without
      # this step every run died on ERR_MODULE_NOT_FOUND before a single
      # assertion ran — which is what the failure emails were.
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund
      - name: Verify
        run: npm run verify
